name: Sword Health
description: 'Sword Health is a digital musculoskeletal (MSK) and virtual physical-therapy
  company that pairs licensed clinicians with an AI Care platform (programs including
  Thrive for MSK, Bloom for pelvic and women''s health, Move, and Mind for mental health,
  with the Phoenix AI care specialist and the Sword Intelligence division). Founded
  in Portugal in 2015, it sells to employers, health plans, and governments rather
  than to individual developers. As of this enrichment pass Sword Health publishes
  no public developer API, developer portal, SDKs, or API documentation; its digital
  surface is member/clinician apps and employer client portals. Real public surfaces
  captured here are its trust center (SOC 2, HIPAA, GDPR), legal pages, newsroom, and
  domain security posture.'
